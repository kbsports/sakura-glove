<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桜キャッチャーミット カラー指定表 | KBスポーツ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:#fdf5f0;color:#1e1e1e;font-size:14px}

/* ===== HEADER ===== */
.hd{background:linear-gradient(135deg,#7a0000 0%,#c01818 60%,#e03030 100%);color:#fff;padding:16px 20px;text-align:center}
.hd h1{font-size:clamp(1em,3vw,1.5em);letter-spacing:.05em}
.hd p{font-size:.8em;opacity:.88;margin-top:4px}

/* ===== LAYOUT ===== */
.wrap{max-width:1200px;margin:0 auto;padding:16px 12px;display:flex;gap:18px;align-items:flex-start}

/* ===== LEFT: 色選択パネル ===== */
.sel-panel{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.sel-panel-title{font-size:.78em;font-weight:bold;color:#7a0000;border-bottom:2px solid #f5e0e0;padding-bottom:6px;margin-bottom:2px;letter-spacing:.04em}
.sel-group-label{font-size:.7em;font-weight:bold;color:#999;margin:6px 0 2px;letter-spacing:.04em;text-transform:uppercase}

.part-row{display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px;padding:5px 8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.part-nm{font-size:.72em;font-weight:bold;color:#444;min-width:80px;line-height:1.3}
.option-sel{width:58px;font-size:.72em;border:1px solid #ddd;border-radius:5px;padding:3px 4px;background:#fafafa;flex-shrink:0;margin-right:3px}.part-sel{flex:1;font-size:.72em;border:1px solid #ddd;border-radius:5px;padding:3px 4px;background:#fafafa;cursor:pointer}
.part-sel:focus{outline:2px solid #c01818;border-color:#c01818}
.swatch{width:20px;height:20px;border-radius:4px;border:1.5px solid rgba(0,0,0,.15);flex-shrink:0;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0 0/8px 8px}
.model-help{font-size:.68em;color:#a64a67;line-height:1.45;padding:0 3px}
.model-info{display:none;background:#fff8fb;border:1px solid #f1c7d7;border-radius:8px;padding:8px 9px;font-size:.7em;line-height:1.5;color:#4a3540}
.model-info.is-visible{display:block}.model-info strong{display:block;color:#8b1745;font-size:1.05em;margin-bottom:3px}.model-info .model-size{color:#8b1745;font-weight:bold}.model-info .model-notes{margin:3px 0 0;padding-left:1.1em}

/* ===== RIGHT: 指定図エリア ===== */
.diag-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.pr{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted #e8e8e8}
.pr>span:last-child{font-weight:bold;color:#c01818;white-space:nowrap;text-align:right}
.prn{color:#8a8a8a;font-size:.92em;padding:2px 0 3px 1em;text-indent:-1em;line-height:1.45}
.pr-h{font-weight:bold;color:#7a0000;border-bottom:2px solid #e5c9c9;padding-bottom:3px;margin:14px 0 6px}
.pr-g{font-weight:bold;margin:8px 0 2px}

.notice{background:#fff8e1;border-left:4px solid #f5a623;border-radius:0 8px 8px 0;padding:8px 12px;font-size:.78em;color:#7a5500;line-height:1.5}

/* 指定図カード */
.diag-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 16px rgba(0,0,0,.10)}
.diag-card-title{font-size:.82em;font-weight:bold;color:#7a0000;text-align:center;margin-bottom:12px;letter-spacing:.04em}

/* ===== 指定図レイアウト（フレックスボックス方式） ===== */
.diag-wrap{
  display:flex; flex-direction:column;
  gap:6px; width:100%; max-width:820px; margin:0 auto;
}

/* TOP：4ラベル横並び */
.diag-top{
  display:flex; gap:6px; justify-content:center;
  padding:0 120px; /* 左右の列幅分を内側に */
}

/* MIDDLE：左列＋グラブ画像＋右列 */
.diag-middle{display:flex; gap:6px; align-items:stretch;}

.diag-left,.diag-right{
  display:flex; flex-direction:column; gap:6px;
  justify-content:space-around;
  flex-shrink:0; width:112px;
}

/* グラブCanvas */
.glove-canvas-wrap{
  flex:1; min-width:0;
  display:flex; align-items:center; justify-content:center;
}
#glove-canvas{
  width:100%; height:auto;
  display:block;
  border-radius:8px;
}

/* BOTTOM：2ラベル横並び（中央寄せ） */
.diag-bottom{
  display:flex; gap:6px; justify-content:center;
  padding:0 120px;
}

/* ラベルボックス共通 */
.lbl{
  border:1.5px solid #bbb; border-radius:6px;
  padding:5px 6px; background:#f0f0f0;
  text-align:center; cursor:default;
  transition:background .2s,color .2s,border-color .2s;
  flex:1;
}
.lbl .ln{font-size:.60em;color:#777;line-height:1.2;display:block}
.lbl .lv{font-size:.78em;font-weight:bold;color:#111;display:block;min-height:1.1em;margin-top:2px}
.lbl.colored .ln{opacity:.8;color:inherit}
.lbl.colored .lv{color:inherit}

/* ===== TRIM STRIP ===== */
.trim-strip{display:flex;gap:6px;flex-wrap:wrap}
.trim-item{flex:1;min-width:120px;border:1.5px solid #bbb;border-radius:8px;padding:8px;text-align:center;background:#f2f2f2;transition:background .2s,color .2s}
.trim-item .tn{font-size:.72em;color:#777}
.trim-item .tv{font-size:.88em;font-weight:bold;color:#111;margin-top:2px;min-height:1.2em}
.trim-item.colored .tn{opacity:.8;color:inherit}
.trim-item.colored .tv{color:inherit}

/* ===== SPEC TABLE ===== */
.spec-wrap{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 16px rgba(0,0,0,.10)}
.spec-wrap-title{font-size:.82em;font-weight:bold;color:#7a0000;margin-bottom:10px;letter-spacing:.04em}
.spec-table{width:100%;border-collapse:collapse;font-size:.8em}
.spec-table th{background:#7a0000;color:#fff;padding:6px 10px;text-align:left;font-weight:normal;letter-spacing:.03em}
.spec-table td{padding:5px 10px;border-bottom:1px solid #f0e0e0;vertical-align:middle}
.spec-table tr:last-child td{border-bottom:none}
.spec-table tr:nth-child(even) td{background:#fdf5f0}
.spec-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.15);margin-right:6px;vertical-align:middle;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0 0/6px 6px}

/* ===== ACTION BAR ===== */
.action-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:9px 20px;border:none;border-radius:8px;font-size:.82em;font-weight:bold;cursor:pointer;letter-spacing:.04em;transition:opacity .15s}
.btn-copy{background:#7a0000;color:#fff}
.btn-reset{background:#eee;color:#444}
.btn:hover{opacity:.82}
.btn-print{background:#2a5a1a;color:#fff}

/* ===== RESPONSIVE ===== */
@media(max-width:820px){
  .wrap{flex-direction:column}
  .sel-panel{width:100%}
  .diag{min-height:320px}
  .lbl{min-width:72px;padding:3px 5px}
  .lbl .ln{font-size:.6em}
  .lbl .lv{font-size:.74em}
}

@media print{
  body{background:#fff}
  .sel-panel,.action-bar,.notice{display:none!important}
  .wrap{padding:0}
  .diag-card,.spec-wrap{box-shadow:none;border:1px solid #ddd}
}

/* ===== 確定モーダル ===== */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal-hd{background:linear-gradient(135deg,#7a0000,#c01818);color:#fff;padding:14px 18px;border-radius:14px 14px 0 0}
.modal-hd h2{font-size:1em;letter-spacing:.04em}
.modal-hd p{font-size:.75em;opacity:.9;margin-top:3px}
.modal-bd{padding:16px 18px}
.modal-bd pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:.8em;line-height:1.6;background:#fdf5f0;border:1px solid #f0e0e0;border-radius:8px;padding:12px;max-height:44vh;overflow:auto}
.modal-note{font-size:.75em;color:#7a5500;background:#fff8e1;border-left:4px solid #f5a623;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:12px;line-height:1.5}
.modal-ft{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px;flex-wrap:wrap}
.btn-confirm{background:#2a5a1a;color:#fff}
.btn-back{background:#eee;color:#444}
.busy{opacity:.55;pointer-events:none}
.done-no{font-size:1.35em;font-weight:bold;color:#7a0000;letter-spacing:.06em;text-align:center;margin:10px 0;line-height:1.4}
/* PDFシート（画面外でレンダリング） */
#pdf-sheet{position:fixed;left:-9999px;top:0;width:720px;background:#fff;color:#1e1e1e;padding:28px;font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
