/* ================================================================

   ・id は素材のマスク名（cm_◯◯.png）とそろえてある

/* いまの型で使うパーツかどうか */
function partUsed(p) {
  const v = (backStyleVal === 'クローズバック') ? 'close' : 'normal';
  return !p.only || p.only === v;
}

/* STATE */
const S = {};
const OPT = {};          // 指カバー／指あて／なし
let orderNo   = '';
// お客様情報（注文送信・PDF控えにのみ使用。復元コードには含めない）
let custName = '', custZip = '', custAddr = '', custTel = '';
let usageVal = '';       // 使用区分 ※表記のみ
let throwHandVal = '';   // 投げ手 ※表記のみ、指定図には反映しない
let tojiDirVal = '順とじ';            // とじ方向：キャッチャーミットはこれのみ ※表記のみ
// ハミダシ：切りハミ＝ホワイト／ブラック、玉ハミ＝本体カラーから選ぶ、なし。
// 線画に無いので指定図には出さない

// バックスタイル：ノーマルバック／クローズバック。ベルトはクローズバックのみに付く。
// ベルトは手首部分にあり線画に描かれていないので、指定図には出さない

let gradeVal  = '';   // 本体グレード（基本価格）
const GRADE_PRICE = { 'ゴム・軟式ミット':46200, '革・硬式ミット':60500 };

const BASE_TITLE = document.title;

/* 注文番号：指定図バッジ＋ページタイトル（印刷PDF名）に反映 */
function setOrderNo(v) {
  orderNo = v.trim();
  const badge = document.getElementById('order-no-badge');
  const val   = document.getElementById('order-no-val');
  if (val) val.textContent = orderNo;
  if (badge) badge.style.display = orderNo ? '' : 'none';
  document.title = orderNo ? `桜キャッチャーミット指定表【注文番号 ${orderNo}】| KBスポーツ` : BASE_TITLE;
}

/* お客様情報：入力のたびに変数へ取り込む */
function setCust() {
  const v = id => (document.getElementById(id)?.value || '').trim();
  custName = v('cust-name');
  custZip  = v('cust-zip');
  custAddr = v('cust-addr');
  custTel  = v('cust-tel');
}

/* 使用区分：表記のみ */
function setUsage(sel) { usageVal = sel.value; }

/* 投げ手（右投げ用／左投げ用）：表記のみ。指定図の絵は変更しない */
function setThrowHand(sel) { throwHandVal = sel.value; }

/* とじ方向：キャッチャーミットは順とじ固定 ※表記のみ */
function setTojiDir(sel) {
  tojiDirVal = sel.value || '順とじ';
  if (sel.value !== tojiDirVal) sel.value = tojiDirVal;
}

/* ================================================================
   バックスタイル（ノーマルバック／クローズバック）とベルトのカラー
   ベルトはクローズバックのみ。線画に無いので指定図には反映しない。
================================================================ */
function setBackStyle(sel) {
  backStyleVal = sel.value;
  updateBeltState();
  updatePartRows();      // 型で使う色欄を出し分ける
  applyViewSize();       // 指定図を入れ替える
  drawMitt();
  renderSpec();
  updatePrice();
}

/* 型で使わない色欄は隠す。隠すときは選んだ色も消して、注文内容に残らないようにする */
function updatePartRows() {
  PARTS.forEach(p => {
    const sel = document.querySelector(`select[data-part="${p.id}"]`);
    if (!sel) return;
    const row = sel.closest('.part-row');
    // 隠すだけで色は消さない。型を戻したときに選び直さずに済む
    if (row) row.style.display = partUsed(p) ? '' : 'none';
  });
  // 注記も型に合わせる
  document.querySelectorAll('[data-style]').forEach(el => {
    const want = (backStyleVal === 'クローズバック') ? 'close' : 'normal';
    el.style.display = (el.dataset.style === want) ? '' : 'none';
  });
}

function setBeltColor(sel) {
  beltColor = sel.value;
  updateBeltSwatch();
  updatePrice();   // ベルトも本体の革なので色数に効く
}

function updateBeltState() {
  const el = document.getElementById('belt-color-sel');
  if (!el) return;
  const on = (backStyleVal === 'クローズバック');
  el.disabled = !on;
  if (!on) { el.value = ''; beltColor = ''; }
  updateBeltSwatch();
}

function updateBeltSwatch() {
  const sw = document.getElementById('sw-belt');
  if (!sw) return;
  const c = BODY_COLORS.find(x => x.n === beltColor);
  sw.style.background = c ? c.hex : '';
}

/* 指出し（本体の革カラー）。線画に無いので指定図には反映しない */
function setFingerOutColor(sel) {
  fingerOutColor = sel.value;
  const sw = document.getElementById('sw-fingerout');
  const c = BODY_COLORS.find(x => x.n === fingerOutColor);
  if (sw) sw.style.background = c ? c.hex : '';
  updatePrice();
}

/* ================================================================
   ハミダシ（切りハミ＝ホワイト／ブラック、玉ハミ＝本体カラー、なし）
   線画に描かれていないため指定図には反映しない。注文内容にのみ載る。
================================================================ */
// カラー欄は選んだ種類に合わせて中身を作り直す
function fillHamidashiColors(names) {
  const cs = document.getElementById('hamidashi-color-sel');
  if (!cs) return;
  cs.innerHTML = '<option value="">— 選択 —</option>';
  names.forEach(nm => {
    const o = document.createElement('option');
    o.value = nm; o.textContent = nm;
    cs.appendChild(o);
  });
}

function setHamidashiType(sel) {
  hamidashiType = sel.value;
  const cs = document.getElementById('hamidashi-color-sel');
  if (cs) {
    if (hamidashiType === '切りハミ') {
      fillHamidashiColors(HAMIDASHI_KIRI_COLORS);
      cs.disabled = false;
    } else if (hamidashiType === '玉ハミ') {
      fillHamidashiColors(BODY_COLORS.map(c => c.n));
      cs.disabled = false;
    } else {
      fillHamidashiColors([]);   // 「なし」と未選択はカラー欄を使わない
      cs.disabled = true;
    }
    cs.value = '';
    hamidashiColor = '';
  }
  updateHamidashiSwatch();
  updatePrice();
}

function setHamidashiColor(sel) {
  hamidashiColor = sel.value;
  updateHamidashiSwatch();
  updatePrice();
}

function updateHamidashiSwatch() {
  const sw = document.getElementById('sw-hamidashi');
  if (!sw) return;
  const c = BODY_COLORS.find(x => x.n === hamidashiColor);
  sw.style.background = c ? c.hex : '';
}

/* グレード（基本価格） */
function setGrade(sel) { gradeVal = sel.value; updatePrice(); }

/* 型番 */
function setModel(sel) {
  selectedModel = sel.value;
  renderModelInfo();
  updatePrice();
}

function renderModelInfo() {
  const box = document.getElementById('model-info');
  const info = MODEL_INFO[selectedModel];
  if (!box) return;
  if (!info) {
    box.classList.remove('is-visible');
    box.innerHTML = '';
    return;
  }
  box.innerHTML = `<strong>${selectedModel}｜${info.type}</strong>` +
    (info.size ? `<span class="model-size">サイズ：${info.size}</span>` : '') +
    `<ul class="model-notes">${info.notes.map(note => `<li>${note}</li>`).join('')}</ul>`;
  box.classList.add('is-visible');
}

/* ================================================================
   ロゴ選択：ロゴごとに必要な本体・フチの色を個別指定
================================================================ */
const LOGOS = {
  '1': {label:'ロゴ1',
        fields:[{key:'l1main',label:'①メイン'},{key:'l1edge',label:'フチ'},{key:'l1sakura',label:'②Sakura'}]},
  '2': {label:'ロゴ2',
        fields:[{key:'l2sakuraMain',label:'SAKURA本体'},{key:'l2sakuraEdge',label:'SAKURAフチ'},
                {key:'l2petalMain',label:'花びら本体'},{key:'l2petalEdge',label:'花びらフチ'}]},
  '3': {label:'ロゴ3',
        fields:[{key:'l3sakuraMain',label:'Sakura本体'},{key:'l3sakuraEdge',label:'Sakuraフチ'},
                {key:'l3petal',label:'花びら'},{key:'l3kb',label:'KB SPORTS'}]},
};
let logoVal = '';
const LOGO_COLOR = {};   // key -> 色名
const LOGO_COLOR_SET = THREAD_COLORS;

__LOGO_PART_IMG__

/* ロゴのパーツ画像を読み込んで保持する（初回のみ） */
const _logoImgCache = {};
function loadLogoParts(logoId) {
  if (_logoImgCache[logoId]) return Promise.resolve(_logoImgCache[logoId]);
  const defs = LOGO_PART_IMG[logoId] || [];
  return Promise.all(defs.map(d => new Promise(res => {
    const im = new Image();
    im.onload  = () => res({key: d.key, img: im});
    im.onerror = () => res({key: d.key, img: null});
    im.src = d.src;
  }))).then(list => { _logoImgCache[logoId] = list; return list; });
}

/* ロゴのPNGは周囲に余白があるので、実際に見えている範囲を持っておく。
   指定図へ置くときはこの範囲を基準にする（余白ぶん小さく見えるのを防ぐ） */
const LOGO_TRIM = {
  '1': {box:[48,126,673,504], w:625, h:378, aspect:1.6534},
  '2': {box:[159,199,1327,901], w:1168, h:702, aspect:1.6638},
  '3': {box:[61,41,1700,860], w:1639, h:819, aspect:2.0012},
};

/* 指定図（背面の下側のパネル）へロゴを置く位置。
   元の線画 c3.png に入っていたロゴの位置・傾きを実測し、そこへ入る最大枠の75%にした。
   cx,cy = 中心（画像に対する比）／w = 画像幅に対するロゴ幅の比／rot = 傾き（度） */
const LOGO_PLACE_NORMAL = {
  '1': {cx:0.2153, cy:0.7984, w:0.1167, rot:-10.64},
  '2': {cx:0.2153, cy:0.7984, w:0.1177, rot:-10.64},
  '3': {cx:0.2121, cy:0.7993, w:0.1328, rot:-10.64},
};
/* クローズバックの指定図（1543x920）は絵が違うので置き場所も別。
   親指パネルの中でいちばん余裕のある点 (421,638)、幅は画像の12%（2026-08-30ユーザー確定） */
const LOGO_PLACE_CLOSE = {
  '1': {cx:0.2729, cy:0.6935, w:0.12, rot:0},
  '2': {cx:0.2729, cy:0.6935, w:0.12, rot:0},
  '3': {cx:0.2729, cy:0.6935, w:0.13, rot:0},
};
function logoPlace() {
  return (backStyleVal === 'クローズバック') ? LOGO_PLACE_CLOSE : LOGO_PLACE_NORMAL;
}

let _logoTmp = null, _logoSprite = null;

/* 選択色で塗ったロゴを1枚のキャンバスにまとめて返す。
   ロゴカードと指定図のロゴが同じものを使うので、色が食い違うことがない。
   色未選択のパーツは元の黒のまま。 */
function buildLogoSprite(logoId) {
  const list = _logoImgCache[logoId];
  if (!list || !list.length || !list[0].img) return null;
  const w = list[0].img.naturalWidth, h = list[0].img.naturalHeight;
  if (!_logoSprite) _logoSprite = document.createElement('canvas');
  _logoSprite.width = w; _logoSprite.height = h;
  const sc = _logoSprite.getContext('2d');
  sc.clearRect(0, 0, w, h);
  if (!_logoTmp) _logoTmp = document.createElement('canvas');
  _logoTmp.width = w; _logoTmp.height = h;
  const tc = _logoTmp.getContext('2d');
  list.forEach(p => {
    if (!p.img) return;
    const name = LOGO_COLOR[p.key];
    const c = name ? LOGO_COLOR_SET.find(x => x.n === name) : null;
    tc.clearRect(0, 0, w, h);
    tc.globalCompositeOperation = 'source-over';
    tc.drawImage(p.img, 0, 0);
    if (c) {
      tc.globalCompositeOperation = 'source-in';   // 形だけ選択色で塗る
      tc.fillStyle = c.hex;
      tc.fillRect(0, 0, w, h);
      tc.globalCompositeOperation = 'source-over';
    }
    sc.drawImage(_logoTmp, 0, 0);
  });
  return _logoSprite;
}

/* 選択色でロゴを塗り分けてロゴカードへ描く */
function drawLogoCanvas() {
  const cv = document.getElementById('logo-canvas');
  if (!cv || !logoVal) return;
  loadLogoParts(logoVal).then(() => {
    const sp = buildLogoSprite(logoVal);
    if (!sp) return;
    cv.width = sp.width; cv.height = sp.height;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(sp, 0, 0);
    drawMitt();   // 指定図のロゴも同時に更新
  });
}

/* 指定図へロゴを重ねる。drawMitt の最後から呼ばれる */
function drawLogoOnDiagram() {
  if (!logoVal || !_displayCtx || !_imgW) return;
  const pl = logoPlace()[logoVal], tr = LOGO_TRIM[logoVal];
  if (!pl || !tr) return;
  if (!_logoImgCache[logoVal]) {
    // まだパーツ画像を読んでいない。読み終わってから描き直す
    loadLogoParts(logoVal).then(() => drawMitt());
    return;
  }
  const sp = buildLogoSprite(logoVal);
  if (!sp) return;
  const dw = pl.w * _imgW, dh = dw / tr.aspect;
  _displayCtx.save();
  _displayCtx.globalCompositeOperation = 'source-over';
  _displayCtx.translate(pl.cx * _imgW, pl.cy * _imgH);
  _displayCtx.rotate(pl.rot * Math.PI / 180);
  // 余白を切り落とし、見えている範囲の中心を置き場所の中心に合わせる
  _displayCtx.drawImage(sp, tr.box[0], tr.box[1], tr.w, tr.h, -dw / 2, -dh / 2, dw, dh);
  _displayCtx.restore();
}

function setLogo(sel) {
  logoVal = sel.value;
  renderLogoColorRows();
  renderLogoCard();
  drawMitt();
}

/* 選んだロゴに応じてカラー選択行を組み立て */
function renderLogoColorRows() {
  const wrap = document.getElementById('logo-color-rows');
  if (!wrap) return;
  wrap.innerHTML = '';
  Object.keys(LOGO_COLOR).forEach(k => delete LOGO_COLOR[k]);
  if (!logoVal) return;
  const opts = THREAD_COLORS.map(c => `<option value="${c.n}">${c.n}</option>`).join('');
  LOGOS[logoVal].fields.forEach(f => {
    const row = document.createElement('div');
    row.className = 'part-row';
    row.innerHTML =
      `<span class="part-nm">${f.label}</span>` +
      `<select class="part-sel" id="logo-${f.key}" onchange="setLogoColor('${f.key}', this)"><option value="">— 選択 —</option>${opts}</select>` +
      `<span class="swatch" id="sw-logo-${f.key}"></span>`;
    wrap.appendChild(row);
  });
}

function setLogoColor(key, el) {
  LOGO_COLOR[key] = el.value;
  const sw = document.getElementById('sw-logo-' + key);
  const c  = THREAD_COLORS.find(x => x.n === el.value);
  if (sw) sw.style.background = c ? c.hex : '';
  renderLogoCard();
}

/* ロゴカード（右パネル）表示 */
function renderLogoCard() {
  const card = document.getElementById('logo-card');
  const nm   = document.getElementById('logo-name');
  const cl   = document.getElementById('logo-colors');
  if (!card) return;
  if (!logoVal) {
    card.style.display = 'none';
    nm.textContent = ''; cl.textContent = '';
    return;
  }
  const L = LOGOS[logoVal];
  nm.textContent = L.label;
  cl.textContent = logoColorSummary();
  card.style.display = '';
  drawLogoCanvas();
}

function logoColorSummary() {
  if (!logoVal) return '';
  const L = LOGOS[logoVal];
  return L.fields.filter(f => LOGO_COLOR[f.key])
                 .map(f => `${f.label}: ${LOGO_COLOR[f.key]}`).join('　');
}

/* ================================================================
   初期化：セレクトボックスに色を追加
================================================================ */
function init() {
  PARTS.forEach(p => {
    const sel = document.querySelector(`select[data-part="${p.id}"]`);
    if (!sel) return;
    // 先頭の空オプションを全カラー項目で「色選択なし」に統一
    if (sel.options.length && sel.options[0].value === '') {
      sel.options[0].textContent = '色選択なし';
    }
    p.colorSet.forEach(c => {
      const op = document.createElement('option');
      op.value = c.n;
      op.textContent = c.n;
      sel.appendChild(op);
    });
  });
  // ハミダシのカラー（種類を選ぶまで中身は空・触れない）
  fillHamidashiColors([]);
  const hc = document.getElementById('hamidashi-color-sel');
  if (hc) hc.disabled = true;
  // ベルトのカラー（革色から選ぶ。クローズバックを選ぶまで触れない）
  const bc = document.getElementById('belt-color-sel');
  if (bc) {
    BODY_COLORS.forEach(c => {
      const op = document.createElement('option');
      op.value = c.n; op.textContent = c.n;
      bc.appendChild(op);
    });
  }
  updateBeltState();
  // 指出しのカラー（本体の革カラーから選ぶ）
  const fo = document.getElementById('fingerout-color-sel');
  if (fo) {
    BODY_COLORS.forEach(c => {
      const op = document.createElement('option');
      op.value = c.n; op.textContent = c.n;
      fo.appendChild(op);
    });
  }
  renderModelInfo();          // 型番は K-1 固定なので最初から出す
  populateEmbrColors();       // 刺繍・丸抜きカラーを構築
  renderSpec();
  updatePrice();
}

/* ================================================================

================================================================ */
function setOption(el) {
  const key = el.dataset.option;
  OPT[key] = el.value;
  // 「なし」ならカラー選択を無効に（指定図では全体の色になる）
  const colorSel = el.closest('.part-row').querySelector('.part-sel');
  if (colorSel) {
    colorSel.disabled = (el.value === 'なし');
    if (el.value === 'なし' && colorSel.value) { colorSel.value = ''; setPart(colorSel); return; }
  }
  renderSpec();
  updatePrice();
}

function setPart(sel) {
  const pid  = sel.dataset.part;
  const name = sel.value;
  const part = PARTS.find(p => p.id === pid);
  if (!part) return;

  S[pid] = name;

  // スウォッチ更新
  const sw = document.getElementById('sw-' + pid);
  if (sw) {
    if (name) {
      const c = part.colorSet.find(c => c.n === name);
      sw.style.background = c ? c.hex : '';
    } else {
      sw.style.background = '';
    }
  }

  renderSpec();
  drawMitt();
  updatePrice();
}

================================================================ */
function renderSpec() {
  const tbody = document.getElementById('spec-body');
  const rows = PARTS.filter(p => p.id !== 'body' && partUsed(p)); // 全体と、型で使わないものは除外
  let html = '';
  const OPT_IDS = ['fingercover'];
  for (let i = 0; i < rows.length; i += 2) {
    const a = rows[i];
    const b = rows[i+1];
    const optA = OPT_IDS.includes(a.id) ? (OPT[a.id] ? '['+OPT[a.id]+'] ' : '') : '';
    const optB = b && OPT_IDS.includes(b.id) ? (OPT[b.id] ? '['+OPT[b.id]+'] ' : '') : '';
    const va = S[a.id] || '—';
    const vb = b ? (S[b.id] || '—') : '';
    const ca = a.colorSet.find(c => c.n === va);
    const cb = b ? b.colorSet.find(c => c.n === vb) : null;
    html += `<tr>
      <td>${a.label}</td>
      <td><span class="spec-swatch" style="${ca?'background:'+ca.hex+';border-color:'+shadeHex(ca.hex,-20):''}">&nbsp;</span>${optA}${va}</td>
      <td>${b ? b.label : ''}</td>
      <td>${b ? `<span class="spec-swatch" style="${cb?'background:'+cb.hex+';border-color:'+shadeHex(cb.hex,-20):''}">&nbsp;</span>${optB}${vb}` : ''}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

/* ================================================================
   概算お見積り価格
================================================================ */
// 本体カラー3色目以降のカウント対象：革色パーツ全体から「ヘリ革」を除く
const BODY_COLOR_EXCLUDE = new Set(['binding']);
const BODY_COLOR_PART_IDS = PARTS.filter(p => p.colorSet === BODY_COLORS && !BODY_COLOR_EXCLUDE.has(p.id)).map(p => p.id);

function calcPrice() {
  const items = [];
  let total = 0;
  const add = (label, amount) => { items.push({label, amount}); total += amount; };

  if (gradeVal && GRADE_PRICE[gradeVal]) add(gradeVal, GRADE_PRICE[gradeVal]);

  // 本体カラー3色目以降（革色として使用した色数−2 が対象）
  const usedColors = new Set();
  BODY_COLOR_PART_IDS.forEach(id => {
    const p = PARTS.find(x => x.id === id);
    if (p && !partUsed(p)) return;          // いまの型で使わない色は数えない
    if (S[id]) usedColors.add(S[id]);
  });
  // ベルト・指出しは指定図に出ないが本体の革なので色数に数える
  if (beltColor) usedColors.add(beltColor);
  if (fingerOutColor) usedColors.add(fingerOutColor);
  const extraColors = Math.max(0, usedColors.size - 2);
  if (extraColors > 0) add(`本体カラー${extraColors}色分（3色目以降）`, extraColors * 3300);

  // 刺繍（親指／小指／平裏／平裏二段目／土手裏）
  EMBR_PLACE_DEFS.forEach(p => {
    const e = EMBR_PLACES[p.key];
    if (!(e.text || e.mono || e.fkType || e.fkColor)) return;
    add(`刺繍（${p.label}）`, 3300);
    if (e.fkType || e.fkColor) add(`刺繍フチ／カゲ加工（${p.label}）`, 3300);
  });

  // 丸抜き
  if (EMBR.maruBase || EMBR.maruEdge || EMBR.maruNumColor || EMBR.maruNumber) {
    add('親指付根 丸抜き', 3300);
  }

  const notes = [];
  if (embrOtherPlace || embrOtherText || embrOtherColor) {
    notes.push('「その他」の刺繍は価格未算入です。KBスポーツへ別途ご相談ください。');
  }
  notes.push('さくぼー／桜吹雪／オリジナル刺繍作成は本ツールでは算出できません。ご希望の場合はKBスポーツへ別途ご相談ください。');

  return { items, total, notes };
}

function updatePrice() {
  const body    = document.getElementById('price-body');
  const totalEl = document.getElementById('price-total');
  const noteEl  = document.getElementById('price-note');
  if (!body || !totalEl) return;
  const { items, total, notes } = calcPrice();
  body.innerHTML = items.length
    ? items.map(it =>
        `<tr><td style="padding:3px 0;color:#444">${escapeHtml(it.label)}</td>` +
        `<td style="padding:3px 0;text-align:right;font-weight:bold;color:#111;white-space:nowrap">¥${it.amount.toLocaleString()}</td></tr>`
      ).join('')
    : `<tr><td colspan="2" style="padding:3px 0;color:#999">グレードを選択すると表示されます</td></tr>`;
  totalEl.textContent = `¥${total.toLocaleString()}`;
  if (noteEl) noteEl.innerHTML = notes.map(n => `※${escapeHtml(n)}`).join('<br>');
}

/* ================================================================
   ユーティリティ
================================================================ */
function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 128;
}

function shadeHex(hex, pct) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, Math.min(255, r + pct));
  g = Math.max(0, Math.min(255, g + pct));
  b = Math.max(0, Math.min(255, b + pct));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function buildOrderLines() {
  const lines = ['■ 桜キャッチャーミット カラー指定表（国内工場）'];
  lines.push(`受付番号: ${orderNo || '（確定時に自動発行）'}`);
  const _d = new Date(), _p = v => String(v).padStart(2, '0');
  lines.push(`注文日: ${_d.getFullYear()}年${_p(_d.getMonth()+1)}月${_p(_d.getDate())}日\n`);
  lines.push('■ お客様情報');
  lines.push(`氏名: ${custName || '未入力'}`);
  lines.push(`郵便番号: ${custZip || '未入力'}`);
  lines.push(`住所: ${custAddr || '未入力'}`);
  lines.push(`電話番号: ${custTel || '未入力'}`);
  lines.push('');
  lines.push('工場: 国内工場');
  lines.push(`投げ手: ${throwHandVal || '未選択'}`);
  lines.push(`使用区分: ${usageVal || '未選択'}`);
  lines.push(`グレード: ${gradeVal || '未選択'}`);
  lines.push(`型番: ${selectedModel}／${(MODEL_INFO[selectedModel]||{}).size || ''}`);
  lines.push(`バックスタイル: ${backStyleVal || '未選択'}`);
  const OPT_IDS_COPY = ['fingercover'];
  PARTS.forEach(p => {
    if (p.id === 'body' || !partUsed(p)) return;
    const v = S[p.id] || '未選択';
    if (OPT_IDS_COPY.includes(p.id)) {
      const opt = OPT[p.id] || '未選択';
      lines.push(`${p.label}: ${opt} / ${v}`);
    } else {
      lines.push(`${p.label}: ${v}`);
    }
  });
  lines.push(`ベルト: ${backStyleVal === 'クローズバック' ? (beltColor || '未選択') : '—（ノーマルバックのため無し）'}`);
  lines.push(`指出し: ${fingerOutColor || '未選択'}`);
  lines.push(`ハミダシ: ${hamidashiType || '未選択'}${hamidashiType && hamidashiType !== 'なし' ? ' / ' + (hamidashiColor || '未選択') : ''}`);
  lines.push(`\nとじ方向: ${tojiDirVal || '未選択'}`);
  // ロゴ
  if (logoVal) {
    const L = LOGOS[logoVal];
    lines.push(`ロゴ: ${L.label}`);
    L.fields.forEach(f => lines.push(`　${f.label}: ${LOGO_COLOR[f.key] || '未選択'}`));
  } else {
    lines.push('ロゴ: 未選択');
  }
  // 刺繍仕様（箇所ごと）
  lines.push('\n■ 刺繍仕様');
  EMBR_PLACE_DEFS.forEach(p => {
    const st = EMBR_PLACES[p.key];
    const parts = [];
    if (st.text) parts.push(`文字「${st.text}」`);
    if (st.font) parts.push(`書体 ${st.font}`);
    if (st.mono) parts.push(`単色 ${st.mono}`);
    if (st.fkType || st.fkColor) parts.push(`${st.fkType || 'フチ/カゲ'} ${st.fkColor || 'カラー未選択'}`);
    lines.push(`${p.label}: ${parts.length ? parts.join('、') : 'なし'}`);
  });
  const otherParts = [];
  if (embrOtherPlace) otherParts.push(`箇所 ${embrOtherPlace}`);
  if (embrOtherText)  otherParts.push(`文字「${embrOtherText}」`);
  if (embrOtherFont)  otherParts.push(`書体 ${embrOtherFont}`);
  if (embrOtherColor) otherParts.push(`カラー ${embrOtherColor}`);
  lines.push(`その他: ${otherParts.length ? otherParts.join('、') : 'なし'}`);
  lines.push('\n■ 親指付根 丸抜き');
  lines.push(`土台カラー: ${EMBR.maruBase || '未選択'}`);
  lines.push(`土台フチカラー: ${EMBR.maruEdge || '未選択'}`);
  lines.push(`番号カラー: ${EMBR.maruNumColor || '未選択'}`);
  lines.push(`番号: ${EMBR.maruNumber || '未記入'}`);
  lines.push(`\n■ 備考\n${embrNote || 'なし'}`);
  const { items: priceItems, total: priceTotal, notes: priceNotes } = calcPrice();
  lines.push('\n■ 概算お見積り（税込）');
  if (priceItems.length) {
    priceItems.forEach(it => lines.push(`${it.label}: ¥${it.amount.toLocaleString()}`));
  } else {
    lines.push('グレード未選択のため算出できません');
  }
  lines.push(`合計: ¥${priceTotal.toLocaleString()}`);
  priceNotes.forEach(n => lines.push(`※${n}`));
  return lines;
}

function copySpec() {
  const text = buildOrderLines().join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    alert('注文内容をコピーしました！');
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('注文内容をコピーしました！');
  });
}

/* ================================================================
   注文確定 → Formspree送信 ＋ 控えPDFダウンロード
================================================================ */
const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mwvglbpn';

// 受付番号の自動発番（形式: KB-YYYYMMDD-XXXX）
function genReceiptNo() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const ymd = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
  const rnd = String(Math.floor(Math.random()*10000)).padStart(4,'0');
  return `KB-${ymd}-${rnd}`;
}

function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// 最終確認モーダルを開く（毎回モーダル内容を組み直して古い状態を残さない）
function openConfirm() {
  if (!backStyleVal) { alert('バックスタイルを選択してください。'); return; }
  setCust();
  const missing = [];
  if (!custName) missing.push('氏名');
  if (!custZip)  missing.push('郵便番号');
  if (!custAddr) missing.push('住所');
  if (!custTel)  missing.push('電話番号');
  if (missing.length) {
    alert('お客様情報の' + missing.join('・') + 'を入力してください。');
    document.getElementById('cust-name')?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const modal = document.querySelector('#confirm-ov .modal');
  modal.innerHTML =
    '<div class="modal-hd"><h2>🌸 ご注文内容の最終確認</h2>' +
    '<p>内容をご確認のうえ、よろしければ確定してください。</p></div>' +
    '<div class="modal-bd"><pre id="confirm-text"></pre>' +
    '<div class="modal-note">「確定・送信する」を押すと、この内容でKBスポーツへ送信され、受付番号が発行されます。' +
    'ご注文控えのPDFが自動でダウンロードされます。</div></div>' +
    '<div class="modal-ft" id="modal-footer">' +
    '<button class="btn btn-back" onclick="closeConfirm()">← 内容を修正する</button>' +
    '<button class="btn btn-confirm" id="do-submit" onclick="submitOrder()">この内容で確定・送信する</button></div>';
  document.getElementById('confirm-text').textContent = buildOrderLines().join('\n');
  document.getElementById('confirm-ov').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirm-ov').classList.remove('show');
}

async function submitOrder() {
  const footer = document.getElementById('modal-footer');
  const btn    = document.getElementById('do-submit');
  footer.classList.add('busy');
  if (btn) btn.textContent = '送信中…';

  // 受付番号を発行して各所へ反映
  const receiptNo = genReceiptNo();
  orderNo = receiptNo;
  setOrderNo(receiptNo);
  const disp = document.getElementById('order-no-display');
  if (disp) { disp.textContent = receiptNo; disp.style.color = '#7a0000'; disp.style.background = '#fff0f0'; }

  const lines = buildOrderLines();

  // 配色の復元コード／リンクを生成（KBが番号から配色を再現できるように）
  const restoreCode = encodeState(getState());
  const restoreUrl  = location.origin + location.pathname + '#load=' + encodeURIComponent(restoreCode);

  // Formspreeへ送信（KBスポーツへ通知）
  let sent = false;
  try {
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        受付番号: receiptNo,
        工場: '国内工場',
        製品: 'キャッチャーミット（国内工場）',
        氏名: custName,
        郵便番号: custZip,
        住所: custAddr,
        電話番号: custTel,
        型番: selectedModel,
        注文内容: lines.join('\n'),
        配色復元リンク: restoreUrl,
        配色復元コード: restoreCode,
        _subject: `【桜キャッチャーミット注文】受付番号 ${receiptNo}`
      })
    });
    sent = res.ok;
  } catch (e) { sent = false; }

  // 控えPDFを事前生成（完了画面のボタンから、お客様のタップで確実に保存）
  _lastPdf = { receiptNo, lines, restoreCode, pdf: null };
  try { _lastPdf.pdf = await buildPdf(receiptNo, lines, restoreCode); }
  catch (e) { console.warn('PDF生成失敗:', e); }

  showDone(receiptNo, sent);
  footer.classList.remove('busy');
}

// 完了画面「PDF保存」ボタン用（iPhoneは共有シート、PC/Androidはダウンロード）
let _lastPdf = null;
async function savePdf(btn) {
  if (!_lastPdf) return;
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'PDF準備中…'; }
  try {
    let pdfData = _lastPdf.pdf;
    if (!pdfData) pdfData = await buildPdf(_lastPdf.receiptNo, _lastPdf.lines, _lastPdf.restoreCode);
    if (!pdfData) { window.print(); return; }
    // iPhone等：ファイル共有が使えるなら共有シートを開く（「ファイルに保存」できる）
    if (pdfData.file && navigator.canShare && navigator.canShare({ files: [pdfData.file] })) {
      try {
        await navigator.share({ files: [pdfData.file], title: '桜キャッチャーミット 注文控え' });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return; // ユーザーがキャンセルしただけ
      }
    }
    // パソコン・Android：通常のダウンロード
    triggerDownload(pdfData.blobUrl, pdfData.filename);
  } catch (e) {
    console.warn('PDF保存失敗:', e);
    alert('PDFの保存に失敗しました。もう一度お試しください。');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

function showDone(receiptNo, sent) {
  const modal = document.querySelector('#confirm-ov .modal');
  modal.innerHTML =
    '<div class="modal-hd"><h2>' + (sent ? '✅ ご注文を承りました' : '⚠️ 送信のご確認をお願いします') + '</h2>' +
    '<p>' + (sent ? '下のボタンからご注文控えPDFを保存してください。' : '') + '</p></div>' +
    '<div class="modal-bd"><div class="done-no">受付番号<br>' + escapeHtml(receiptNo) + '</div>' +
    (sent

// 控えPDFシートのHTMLを組み立て
function buildPdfSheetHTML(receiptNo, lines, restoreCode) {

  } catch (e) {}
  const body = lines.map(l => l.startsWith('■')
    ? `<div style="font-weight:bold;color:#7a0000;margin:14px 0 5px;border-bottom:2px solid #f0e0e0;padding-bottom:3px">${escapeHtml(l.replace(/^■\s*/,''))}</div>`

  return (

      '<div style="font-size:1.3em;font-weight:bold;color:#7a0000">🌸 桜キャッチャーミット カラー指定表（ご注文控え）</div>' +
      '<div style="font-size:.85em;color:#666;margin-top:4px">KBスポーツ</div>' +

      '<div><b>受付番号：</b><span style="color:#7a0000;font-weight:bold">' + escapeHtml(receiptNo) + '</span></div>' +
      '<div><b>発行日時：</b>' + dateStr + '</div>' +

    (restoreCode
      ? '<div style="margin-top:16px;border-top:1px dashed #ccc;padding-top:8px">' +

// PDFを生成し、ダウンロード用の blob URL・ファイル名・Fileを返す（保存はしない）
async function buildPdf(receiptNo, lines, restoreCode) {
  const sheet = document.getElementById('pdf-sheet');
  sheet.innerHTML = buildPdfSheetHTML(receiptNo, lines, restoreCode);
  const img = sheet.querySelector('img');
  if (img && !img.complete) { await new Promise(r => { img.onload = img.onerror = r; }); }

  if (!window.html2canvas || !window.jspdf) return null;

  const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff' });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const ih = canvas.height * pw / canvas.width;
  const imgData = canvas.toDataURL('image/jpeg', 0.9);

  let heightLeft = ih, position = 0;
  pdf.addImage(imgData, 'JPEG', 0, position, pw, ih);
  heightLeft -= ph;
  while (heightLeft > 0) {
    position = heightLeft - ih;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, pw, ih);
    heightLeft -= ph;
  }
  const blob = pdf.output('blob');
  const filename = `桜キャッチャーミット注文控え_${receiptNo}.pdf`;
  let file = null;
  try { file = new File([blob], filename, { type: 'application/pdf' }); } catch (e) { file = null; }
  return { blobUrl: URL.createObjectURL(blob), filename, file };
}

// blob URL を実際にダウンロードさせる（フォールバック用）
function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

// UTF-8対応の base64url エンコード／デコード（日本語の色名も安全）
function encodeState(st) {
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(st))));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeState(code) {
  let b64 = String(code).trim().replace(/-/g,'+').replace(/_/g,'/');
  while (b64.length % 4) b64 += '=';
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

// オブジェクトから全選択を画面に復元
function applyState(st) {
  if (!st) return;
  clearAll();
  const setSel = (id, val, handler) => {
    const el = document.getElementById(id);
    if (el && val != null) { el.value = val; if (handler) handler(el); }
  };
  if (st.th) setSel('throw-hand-sel', st.th, setThrowHand);
  if (st.us) setSel('usage-sel', st.us, setUsage);
  if (st.td) setSel('toji-dir-sel', st.td, setTojiDir);
  if (st.gr) setSel('grade-sel', st.gr, setGrade);
  // バックスタイル（先に。クローズバックのときだけベルトの色が有効になる）
  if (st.bs) setSel('back-style-sel', st.bs, setBackStyle);
  if (st.bc) setSel('belt-color-sel', st.bc, setBeltColor);
  if (st.fo) setSel('fingerout-color-sel', st.fo, setFingerOutColor);
  // ハミダシ（タイプを先に。カラー欄の中身が種類で変わる）
  if (st.hm) {
    setSel('hamidashi-type-sel', st.hm[0], setHamidashiType);
    if (st.hm[1]) setSel('hamidashi-color-sel', st.hm[1], setHamidashiColor);
  }
  // ロゴ＋ロゴ色
  if (st.lg) {
    setSel('logo-sel', st.lg, setLogo);
    if (st.lgc) Object.keys(st.lgc).forEach(k => {
      const el = document.getElementById('logo-' + k);
      if (el) { el.value = st.lgc[k]; setLogoColor(k, el); }
    });
  }
  // 指カバー／指あて（色欄と「取り付ける指」の有効化のため先に）
  if (st.O) Object.keys(st.O).forEach(k => {
    const el = document.querySelector(`select[data-option="${k}"]`);
    if (el) { el.value = st.O[k]; setOption(el); }
  });
  // 革色・紐・ステッチなど
  if (st.S) Object.keys(st.S).forEach(pid => {
    const el = document.querySelector(`select[data-part="${pid}"]`);
    if (el) { el.value = st.S[pid]; setPart(el); }
  });
  // 刺繍箇所
  if (st.ep) EMBR_PLACE_DEFS.forEach(p => {
    const a = st.ep[p.key]; if (!a) return;
    const map = [['text','text'],['mono','mono'],['fktype','fkType'],['fkcolor','fkColor'],['font','font']];
    map.forEach(([dom, fld], i) => {
      const el = document.getElementById(`ep-${p.key}-${dom}`);
      if (el && a[i] != null) { el.value = a[i]; setEmbrPlaceField(p.key, fld, el); }
    });
  });
  // その他・備考
  if (st.eo) {
    ['ep-other-place','ep-other-text','ep-other-color','ep-other-font'].forEach((id,i) => {
      const el = document.getElementById(id); if (el) el.value = st.eo[i] || '';
    });
    embrOtherPlace = st.eo[0] || ''; embrOtherText = st.eo[1] || ''; embrOtherColor = st.eo[2] || ''; embrOtherFont = st.eo[3] || '';
  }
  if (st.en != null) { const el = document.getElementById('embr-note'); if (el) el.value = st.en; embrNote = st.en; }
  // 丸抜き
  if (st.mr) {
    const md = { maruBase:'maru-base', maruEdge:'maru-edge', maruNumColor:'maru-num-color', maruNumber:'maru-number' };
    Object.keys(md).forEach(k => {
      if (st.mr[k] == null) return;
      const el = document.getElementById(md[k]);
      if (el) { el.value = st.mr[k]; setEmbrField(k, el); }
    });
  }
  // 受付番号
  if (st.on) {
    orderNo = st.on; setOrderNo(st.on);
    const disp = document.getElementById('order-no-display');
    if (disp) { disp.textContent = st.on; disp.style.color = '#7a0000'; disp.style.background = '#fff0f0'; }
  }
  renderSpec();
  drawMitt();
  updatePrice();
}

// URLの #load=... から自動復元（Canvas準備後に呼ばれる）
function restoreFromHash() {
  const m = location.hash.match(/[#&]load=([^&]+)/);
  if (!m) return;
  try { applyState(decodeState(decodeURIComponent(m[1]))); }
  catch (e) { console.warn('リンクからの復元に失敗:', e); }
}

/* ================================================================
   Canvas キャッチャーミット カラーリング
   ・パーツごとの黒一色PNG（cm_*.png）を source-in で選択色に塗り、重ねる
   ・最後に線画を multiply で最上面に置く（白は塗り色を消さない）
   ・flood fill は使わない。塗り分けは素材づくりの段階で確定している
================================================================ */

// 描く順番。奥から手前へ。[マスク名, 色を取るパーツID]
//   backU（背面のU字部）は平裏と同じ色にする（ユーザー確定）
const CM_DRAW = [
  ['palm',        'palm'],
  ['backU',       'hiradashi'],
  ['target',      'target'],
  ['web',         'web'],
  ['backThumb',   'backThumb'],
  ['backLittle',  'backLittle'],
  ['fingercover', 'fingercover'],
  ['hiradashi',   'hiradashi'],
  ['binding',     'binding'],
  ['lace',        'lace'],
  ['thumbLoop',   'thumbLoop'],
  ['littleLoop',  'littleLoop'],
  ['stitch',      'thread'],
];

/* クローズバックの描く順番。
   ベルト・指出し・ハミダシは PARTS ではなく専用の変数に色を持っているので
   '@' をつけて区別する（cmColorOf が見分ける）。 */
const CB_DRAW = [
  ['palm',        'palm'],
  ['target',      'target'],
  ['web',         'web'],
  ['thumb',       'thumb'],
  ['middle',      'middle'],
  ['ringPinky',   'ringPinky'],
  ['base',        'base'],
  ['fingercover', 'fingercover'],
  ['fingerout',   '@fingerout'],
  ['belt',        '@belt'],
  ['hamidashi',   '@hamidashi'],
  ['binding',     'binding'],
  ['lace',        'lace'],
  ['thumbLoop',   'thumbLoop'],
  ['littleLoop',  'littleLoop'],
  ['stitch',      'thread'],
];

/* いまの型で使う一式（線画・マスク・描く順番） */
function curView() {
  return (backStyleVal === 'クローズバック')
    ? {key:'close',  line: CB_LINE, masks: CB_MASKS, draw: CB_DRAW}
    : {key:'normal', line: CM_LINE, masks: CM_MASKS, draw: CM_DRAW};
}

const _cmImg = {normal:{}, close:{}};   // 型 -> マスク名 -> Image
let _cmTmp = null;          // 選択色で塗るための一時キャンバス
let _lineImg = null;        // 表示用の線画
let _imgW = 0, _imgH = 0;
let _displayCtx = null;

/* パーツの色を決める。
   個別に選んでいなければ「全体」の色を使う。ただし縫い糸だけは別扱い。 */
function cmColorOf(id) {
  // ベルト・指出し・ハミダシは PARTS の外に色を持っている
  if (id.charAt(0) === '@') {
    const v = id === '@belt' ? beltColor
            : id === '@fingerout' ? fingerOutColor
            : id === '@hamidashi' ? hamidashiColor : '';
    if (!v) return null;
    const c = BODY_COLORS.find(c => c.n === v);
    return c ? c.hex : null;
  }
  const name = S[id];
  if (name) {
    const set = (id === 'lace') ? LACE_COLORS : (id === 'thread') ? THREAD_COLORS : BODY_COLORS;
    const c = set.find(c => c.n === name);
    if (c) return c.hex;
  }
  if (id === 'thread') return '#000000';   // 未選択の縫い糸は線画どおり黒
  if (S['body']) {
    const c = BODY_COLORS.find(c => c.n === S['body']);
    if (c) return c.hex;
  }
  return null;   // 塗らない（線画の白のまま）
}

const _lineImgs = {};       // 型 -> 線画のImage

function initMittCanvas() {
  const canvas = document.getElementById('glove-canvas');
  if (!canvas) return;
  _displayCtx = canvas.getContext('2d');

  const sets = [
    {key:'normal', line: CM_LINE, masks: CM_MASKS, draw: CM_DRAW},
    {key:'close',  line: CB_LINE, masks: CB_MASKS, draw: CB_DRAW},
  ];
  let pending = sets.reduce((t, v) => t + 1 + v.draw.length, 0);
  const done = () => {
    applyViewSize();
    drawMitt();
    if (--pending === 0) restoreFromHash();
  };

  sets.forEach(v => {
    const li = new Image();
    li.onload = li.onerror = done;
    li.src = v.line;
    _lineImgs[v.key] = li;
    v.draw.forEach(([mask]) => {
      const im = new Image();
      im.onload = im.onerror = done;
      im.src = v.masks[mask];
      _cmImg[v.key][mask] = im;
    });
  });
}

/* いまの型に合わせてキャンバスの大きさと線画を差し替える */
function applyViewSize() {
  const canvas = document.getElementById('glove-canvas');
  const v = curView();
  const li = _lineImgs[v.key];
  if (!canvas || !li || !li.complete || !li.naturalWidth) return;
  _lineImg = li;
  _imgW = li.naturalWidth;
  _imgH = li.naturalHeight;
  if (canvas.width !== _imgW || canvas.height !== _imgH) {
    canvas.width = _imgW; canvas.height = _imgH;
  }
}

// ミットを合成して表示
function drawMitt() {
  if (!_displayCtx || !_imgW) return;
  const cv = document.getElementById('glove-canvas');
  _displayCtx.globalCompositeOperation = 'source-over';
  _displayCtx.clearRect(0, 0, cv.width, cv.height);

  // 白背景
  _displayCtx.fillStyle = '#ffffff';
  _displayCtx.fillRect(0, 0, cv.width, cv.height);

  if (!_cmTmp) _cmTmp = document.createElement('canvas');
  if (_cmTmp.width !== _imgW || _cmTmp.height !== _imgH) {
    _cmTmp.width = _imgW; _cmTmp.height = _imgH;
  }
  const tc = _cmTmp.getContext('2d');

  // パーツを選択色で塗って重ねる
  const view = curView();
  view.draw.forEach(([mask, pid]) => {
    const im = _cmImg[view.key][mask];
    if (!im || !im.complete || !im.naturalWidth) return;
    const hex = cmColorOf(pid);
    if (!hex) return;
    tc.globalCompositeOperation = 'source-over';
    tc.clearRect(0, 0, _imgW, _imgH);
    tc.drawImage(im, 0, 0);
    tc.globalCompositeOperation = 'source-in';   // 形だけ選択色で塗る
    tc.fillStyle = hex;
    tc.fillRect(0, 0, _imgW, _imgH);
    tc.globalCompositeOperation = 'source-over';
    _displayCtx.drawImage(_cmTmp, 0, 0);
  });

  // 線画を最上面に重ねる
  // multiply: 白(1.0)×塗り色=塗り色、黒(0)×塗り色=黒 → 線画の白ピクセルが塗り色を消さない
  if (_lineImg && _lineImg.complete && _lineImg.naturalWidth) {
    _displayCtx.globalCompositeOperation = 'multiply';
    _displayCtx.drawImage(_lineImg, 0, 0);
  }

  _displayCtx.globalCompositeOperation = 'source-over';
  drawLogoOnDiagram();
}

/* 起動 */
init();
initMittCanvas();
